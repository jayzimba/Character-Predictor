name: temperament-lab

# Isolated stack: own network, own MariaDB, own HTTP port.
# Does not bind 80, 443, 3306, 8080, or 3001 used by cPanel / MyVows / Tomcat.

services:
  db:
    image: mariadb:11.4
    container_name: temperament-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: personality_classification
      MYSQL_USER: temperament
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - temperament-db:/var/lib/mysql
    hostname: db
    networks:
      temperament:
        ipv4_address: 10.91.70.10
        aliases: [db]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 24
    # No host ports — not the VPS MariaDB on 3306.

  api:
    build:
      context: ./backend
    container_name: temperament-api
    hostname: api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    extra_hosts:
      - "db:10.91.70.10"
    volumes:
      - temperament-models:/app/app/ml/models
    networks:
      temperament:
        ipv4_address: 10.91.70.20
        aliases: [api]

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    container_name: temperament-web
    hostname: web
    restart: unless-stopped
    depends_on:
      - api
    extra_hosts:
      - "api:10.91.70.20"
    ports:
      - "9100:80"
    networks:
      temperament:
        ipv4_address: 10.91.70.30
        aliases: [web]

# Pre-created with --disable-dns: cPanel PowerDNS already binds host UDP 53,
# so Podman aardvark-dns cannot start on the default bridge.
# extra_hosts + static IPs replace container DNS for db/api.
networks:
  temperament:
    name: temperament-lab
    external: true

volumes:
  temperament-db:
  temperament-models:
